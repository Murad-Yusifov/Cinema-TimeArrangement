
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema Schedule Converter</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <!-- MathJax displays mathematical expressions -->
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)']] }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 25px;
    }

    input, button {
      margin: 8px 0;
      padding: 8px;
    }

    table {
      border-collapse: collapse;
      margin-top: 20px;
      width: 100%;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }

    pre {
      white-space: pre-wrap;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <h2>Cinema Schedule Converter</h2>

  <input type="file" id="fileInput" accept=".xls,.xlsx">
  <button onclick="convertSchedule()">Convert Schedule</button>
  <button onclick="copyResult()">Copy Schedule</button>

  <h3>Schedule Output</h3>
  <pre id="output">Upload an Excel file first.</pre>

  <table>
    <thead>
      <tr>
        <th>Hour</th>
        <th>Room End Times</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <hr>

  <h3>Power Expression Converter</h3>

  <label>
    Base:
    <input type="number" id="base" value="3">
  </label>

  <label>
    Exponent:
    <input type="number" id="exponent" value="3" min="0" max="100">
  </label>

  <button onclick="convertPower()">Calculate</button>

  <p id="powerOutput"></p>

  <script>
    const roomNumbers = {
      "platinum": 1,
      "coca-cola": 2,
      "badamli": 5,
      "1664 blanc": 6,
      "mastercard": 8,
      "dolby atmos": 9
    };

    async function convertSchedule() {
      const file = document.getElementById("fileInput").files[0];
      const output = document.getElementById("output");
      const tableBody = document.getElementById("tableBody");

      if (!file) {
        output.textContent = "Please select an Excel file.";
        return;
      }

      try {
        const buffer = await file.arrayBuffer();
        const workbook = XLSX.read(buffer, { type: "array" });
        const sheet = workbook.Sheets[workbook.SheetNames[0]];

        const rows = XLSX.utils.sheet_to_json(sheet, {
          header: 1,
          defval: "",
          raw: false
        });

        const schedule = {};

        for (let hour = 0; hour < 24; hour++) {
          schedule[hour] = [];
        }

        let currentRoom = null;
        let endTimeColumn = -1;

        for (const row of rows) {
          const cells = row.map(value =>
            String(value ?? "").trim()
          );

          // Identify a room section.
          const roomHeader = cells.find(cell =>
            /зал\s*:/i.test(cell)
          );

          if (roomHeader) {
            const name = roomHeader
              .replace(/^.*?зал\s*:\s*/i, "")
              .split(",")[0]
              .trim()
              .toLowerCase();

            currentRoom = roomNumbers[name] ?? null;
            endTimeColumn = -1;
            continue;
          }

          // Find the end-time column.
          const headerIndex = cells.findIndex(cell =>
            /конец\s+сеанса/i.test(cell)
          );

          if (headerIndex !== -1) {
            endTimeColumn = headerIndex;
            continue;
          }

          if (currentRoom === null || endTimeColumn === -1) {
            continue;
          }

          const value = cells[endTimeColumn];

          // Read end times such as 12:25 or 01:30.
          const match = value.match(/^(\d{1,2}):(\d{2})$/);

          if (!match) continue;

          const hour = Number(match[1]);
          const minute = Number(match[2]);

          if (hour > 23 || minute > 59) continue;

          schedule[hour].push({
            room: currentRoom,
            minute
          });
        }

        // Sort sessions by ending minute.
        for (const hour in schedule) {
          schedule[hour].sort((a, b) =>
            a.minute - b.minute || a.room - b.room
          );
        }

        // Start at 10:00, continue through midnight.
        const hours = [
          ...Array.from({ length: 14 }, (_, i) => i + 10),
          ...Array.from({ length: 10 }, (_, i) => i)
        ];

        const lines = hours.map(hour => {
          const entries = schedule[hour].map(item =>
            `${item.room}^${String(item.minute).padStart(2, "0")}`
          );

          return `${hour}-${entries.join("-")}`;
        });

        output.textContent = lines.join("\n");
        tableBody.replaceChildren();

        for (const hour of hours) {
          const tr = document.createElement("tr");
          const hourCell = document.createElement("td");
          const entriesCell = document.createElement("td");

          hourCell.textContent = hour;
          entriesCell.textContent = schedule[hour]
            .map(item =>
              `${item.room}^${String(item.minute).padStart(2, "0")}`
            )
            .join(" - ");

          tr.append(hourCell, entriesCell);
          tableBody.appendChild(tr);
        }

      } catch (error) {
        output.textContent = "Error: " + error.message;
      }
    }

    async function copyResult() {
      const text = document.getElementById("output").textContent;

      try {
        await navigator.clipboard.writeText(text);
      } catch {
        alert("Copy failed. Please select and copy the output manually.");
      }
    }

    // Convert a power into its multiplication form.
    function convertPower() {
      const baseInput = document.getElementById("base").value;
      const exponentInput = document.getElementById("exponent").value;
      const output = document.getElementById("powerOutput");

      if (baseInput === "" || exponentInput === "") {
        output.textContent = "Enter a base and an exponent.";
        return;
      }

      const base = Number(baseInput);
      const exponent = Number(exponentInput);

      if (
        !Number.isFinite(base) ||
        !Number.isInteger(exponent) ||
        exponent < 0 ||
        exponent > 100
      ) {
        output.textContent = "Enter a valid base and an exponent from 0 to 100.";
        return;
      }

      const multiplication = exponent === 0
        ? "1"
        : Array(exponent).fill(base).join(" \\times ");

      const result = base ** exponent;

      output.textContent =
        `\\(${base}^{${exponent}} = ${multiplication} = \\boxed{${result}}\\)`;

      if (window.MathJax?.typesetPromise) {
        MathJax.typesetPromise([output]);
      }
    }

    convertPower();
  </script>

</body>
</html>
