
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cinema Schedule Converter</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 25px;
    }

    input, button {
      padding: 8px;
      margin: 5px 3px 5px 0;
    }

    pre {
      white-space: pre-wrap;
      line-height: 1.8;
      font-size: 18px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }

    .session {
      display: inline-block;
      margin: 4px 12px 4px 0;
      font-size: 20px;
    }

    .session sup {
      font-size: 0.65em;
      vertical-align: super;
    }
  </style>
</head>

<body>
  <h2>Cinema Schedule Converter</h2>

  <input type="file" id="fileInput" accept=".xls,.xlsx">

  <button id="convertButton">Convert</button>
  <button id="copyButton">Copy Schedule</button>
  <button id="clearButton">Clear Saved Schedule</button>

  <p id="status">Upload your Excel file.</p>

  <h3>Converted Schedule</h3>
  <pre id="output">No schedule loaded.</pre>

  <h3>Visual Schedule</h3>

  <table>
    <thead>
      <tr>
        <th>Hour</th>
        <th>Room Number with Ending Minute</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>

  <script>
    const STORAGE_KEY = "cinemaScheduleV4";

    // Cinema room names and their numbers.
    const roomNumbers = {
      "platinum": 1,
      "coca-cola": 2,
      "badamli": 5,
      "1664 blanc": 6,
      "mastercard": 8,
      "dolby atmos": 9
    };

    // Convert ordinary digits into superscript digits.
    const superscriptDigits = {
      "0": "⁰",
      "1": "¹",
      "2": "²",
      "3": "³",
      "4": "⁴",
      "5": "⁵",
      "6": "⁶",
      "7": "⁷",
      "8": "⁸",
      "9": "⁹"
    };

    function toSuperscript(number) {
      return String(number)
        .split("")
        .map(digit => superscriptDigits[digit])
        .join("");
    }

    const fileInput = document.getElementById("fileInput");
    const output = document.getElementById("output");
    const tableBody = document.getElementById("tableBody");
    const status = document.getElementById("status");

    // Display hours from 10 to 23, then 0 to 9.
    const hours = [
      ...Array.from({ length: 14 }, (_, i) => i + 10),
      ...Array.from({ length: 10 }, (_, i) => i)
    ];

    document.getElementById("convertButton")
      .addEventListener("click", convertSchedule);

    document.getElementById("copyButton")
      .addEventListener("click", copyResult);

    document.getElementById("clearButton")
      .addEventListener("click", clearSavedSchedule);

    restoreSchedule();

    function createEmptySchedule() {
      const schedule = {};

      for (let hour = 0; hour < 24; hour++) {
        schedule[hour] = [];
      }

      return schedule;
    }

    async function convertSchedule() {
      const file = fileInput.files[0];

      if (!file) {
        status.textContent = "Please select an Excel file.";
        return;
      }

      if (typeof XLSX === "undefined") {
        status.textContent = "Excel library failed to load.";
        return;
      }

      try {
        const buffer = await file.arrayBuffer();

        const workbook = XLSX.read(buffer, {
          type: "array"
        });

        const schedule = createEmptySchedule();

        // Read all worksheets.
        for (const sheetName of workbook.SheetNames) {
          const sheet = workbook.Sheets[sheetName];

          const rows = XLSX.utils.sheet_to_json(sheet, {
            header: 1,
            defval: "",
            raw: false
          });

          let currentRoom = null;
          let endTimeColumn = -1;

          for (const row of rows) {
            const cells = row.map(value =>
              String(value ?? "").trim()
            );

            // Find a room heading, for example:
            // Зал: Mastercard
            const roomHeader = cells.find(cell =>
              /зал\s*:/i.test(cell)
            );

            if (roomHeader) {
              const roomName = roomHeader
                .replace(/^.*?зал\s*:\s*/i, "")
                .split(",")[0]
                .trim()
                .toLowerCase();

              currentRoom = roomNumbers[roomName] ?? null;
              endTimeColumn = -1;
              continue;
            }

            // Find the session ending-time column.
            const headerIndex = cells.findIndex(cell =>
              /конец\s+сеанса/i.test(cell)
            );

            if (headerIndex !== -1) {
              endTimeColumn = headerIndex;
              continue;
            }

            // Ignore unrecognized rooms and unrelated rows.
            if (currentRoom === null || endTimeColumn === -1) {
              continue;
            }

            const value = cells[endTimeColumn];

            // Expected time format: HH:MM.
            const match = value.match(/^(\d{1,2}):(\d{2})$/);

            if (!match) continue;

            const hour = Number(match[1]);
            const minute = Number(match[2]);

            if (hour > 23 || minute > 59) continue;

            schedule[hour].push({
              room: currentRoom,
              minute
            });
          }
        }

        // Sort sessions by ending minute, smallest first.
        for (const hour of Object.keys(schedule)) {
          schedule[hour].sort((a, b) =>
            a.minute - b.minute || a.room - b.room
          );
        }

        // Example: 11-6⁰⁰-7¹⁵-9³⁰-3⁵⁵
        const lines = hours.map(hour => {
          const entries = schedule[hour].map(item => {
            const minute = String(item.minute).padStart(2, "0");

            return `${item.room}${toSuperscript(minute)}`;
          });

          return `${hour}-${entries.join("-")}`;
        });

        const savedData = {
          schedule,
          output: lines.join("\n"),
          fileName: file.name
        };

        // Save the converted schedule in this browser.
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify(savedData)
        );

        displaySchedule(savedData);

        status.textContent = `Schedule converted and saved: ${file.name}`;

      } catch (error) {
        status.textContent = "Error: " + error.message;
      }
    }

    function displaySchedule(data) {
      output.textContent = data.output;
      tableBody.replaceChildren();

      for (const hour of hours) {
        const tr = document.createElement("tr");
        const hourCell = document.createElement("td");
        const entriesCell = document.createElement("td");

        hourCell.textContent = hour;

        for (const item of data.schedule[hour]) {
          const session = document.createElement("span");
          session.className = "session";

          // Room number is the base.
          session.appendChild(
            document.createTextNode(String(item.room))
          );

          // Ending minute is the superscript.
          const sup = document.createElement("sup");
          sup.textContent = String(item.minute).padStart(2, "0");

          session.appendChild(sup);
          entriesCell.appendChild(session);
        }

        tr.append(hourCell, entriesCell);
        tableBody.appendChild(tr);
      }
    }

    async function copyResult() {
      try {
        await navigator.clipboard.writeText(output.textContent);
        status.textContent = "Schedule copied.";
      } catch {
        status.textContent =
          "Copy failed. Select the output text and copy it manually.";
      }
    }

    function restoreSchedule() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);

        if (!saved) return;

        const data = JSON.parse(saved);

        if (!data.schedule || !data.output) return;

        for (let hour = 0; hour < 24; hour++) {
          if (!Array.isArray(data.schedule[hour])) {
            data.schedule[hour] = [];
          }
        }

        displaySchedule(data);

        status.textContent =
          `Restored saved schedule${data.fileName ? ": " + data.fileName : ""}.`;

      } catch {
        status.textContent = "Could not restore saved schedule.";
      }
    }

    function clearSavedSchedule() {
      localStorage.removeItem(STORAGE_KEY);

      output.textContent = "No schedule loaded.";
      tableBody.replaceChildren();

      status.textContent = "Saved schedule cleared.";
    }
  </script>
</body>
</html>
